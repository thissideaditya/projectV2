<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ADA Law Chambers</title>
<link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <a href="../index.html" class="brand">
      <img src="../assets/images/logo-header.webp" alt="ADA Law Chambers crest">
      <span class="brand-text"><strong>ADA Law Chambers</strong><span>Admin Panel</span></span>
    </a>

    <div class="alert error" id="login-error" hidden></div>

    <form id="login-form">
      <div class="field" style="margin-bottom:1rem;">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" placeholder="email">
      </div>
      <div class="field" style="margin-bottom:1.5rem;">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <button class="btn btn--gold btn--full" type="submit">Sign In</button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;"><a href="../index.html" style="font-size:.85rem;color:var(--ink-500);">&larr; Back to website</a></p>
  </div>
</div>

<script src="../js/api-config.js"></script>
<script src="../js/hostinger-client.js"></script>
<script src="admin.js"></script>
</body>
</html>

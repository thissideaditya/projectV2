<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications — ADA Law Chambers Admin</title>
<link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="../index.html" class="brand">
      <img src="../assets/images/logo-header.webp" alt="ADA Law Chambers crest">
      <span class="brand-text"><strong>ADA Law Chambers</strong><span>Admin Panel</span></span>
    </a>
    <nav class="admin-nav">
      <a href="dashboard.html">Rules &amp; Thoughts</a>
      <a href="editor.html">New Post</a>
      <a href="articles.html">Articles</a>
      <a href="links.html">Important Links</a>
      <a href="resources.html">Resources</a>
      <a href="messages.html">Messages</a>
      <a href="applications.html" class="active">Applications</a>
      <a href="../index.html">View Website</a>
    </nav>
    <div>
      <p style="font-size:.78rem;color:rgba(244,233,201,.7);margin-bottom:.5rem;" id="admin-user-label"></p>
      <button class="btn btn--outline btn--sm btn--full" data-logout>Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topline">
      <div>
        <h1 style="margin-bottom:.2rem;font-size:1.6rem;">Applications</h1>
        <p style="margin:0;color:var(--ink-500);font-size:.9rem;">Internship and Associate applications from the Careers page, newest first.</p>
      </div>
    </div>

    <div class="admin-card">
      <div style="display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap;">
        <button class="btn btn--sm btn--outline-dark active" data-filter="">All</button>
        <button class="btn btn--sm btn--outline-dark" data-filter="internship">Internship</button>
        <button class="btn btn--sm btn--outline-dark" data-filter="associate">Associate</button>
      </div>
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Type</th><th>Applicant</th><th>Details</th><th>Resume</th><th>Received</th></tr>
          </thead>
          <tbody id="applications-table-body">
            <tr><td colspan="5">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../js/api-config.js"></script>
<script src="../js/hostinger-client.js"></script>
<script src="admin.js"></script>
</body>
</html>

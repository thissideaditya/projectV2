<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Important Links — ADA Law Chambers Admin</title>
<link rel="icon" href="../assets/images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="../index.html" class="brand">
      <img src="../assets/images/logo-header.webp" alt="ADA Law Chambers crest">
      <span class="brand-text"><strong>ADA Law Chambers</strong><span>Admin Panel</span></span>
    </a>
    <nav class="admin-nav">
      <a href="dashboard.html">Rules &amp; Thoughts</a>
      <a href="editor.html">New Post</a>
      <a href="articles.html">Articles</a>
      <a href="links.html" class="active">Important Links</a>
      <a href="resources.html">Resources</a>
      <a href="messages.html">Messages</a>
      <a href="applications.html">Applications</a>
      <a href="../index.html">View Website</a>
    </nav>
    <div>
      <p style="font-size:.78rem;color:rgba(244,233,201,.7);margin-bottom:.5rem;" id="admin-user-label"></p>
      <button class="btn btn--outline btn--sm btn--full" data-logout>Sign Out</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topline">
      <div>
        <h1 style="margin-bottom:.2rem;font-size:1.6rem;">Important Links</h1>
        <p style="margin:0;color:var(--ink-500);font-size:.9rem;">Shown publicly under Insights &rarr; Important Links.</p>
      </div>
    </div>

    <form class="admin-card" id="link-form">
      <div class="form-grid">
        <div class="field full">
          <label for="link-title">Title</label>
          <input id="link-title" required placeholder="e.g. CBIC GST Notifications">
        </div>
        <div class="field full">
          <label for="link-url">URL</label>
          <input id="link-url" required placeholder="https://&hellip;">
        </div>
        <div class="field full">
          <label for="link-description">Description (optional)</label>
          <textarea id="link-description" style="min-height:70px;"></textarea>
        </div>
        <div class="field">
          <label for="link-order">Display Order</label>
          <input id="link-order" type="number" value="0" placeholder="Lower numbers show first">
        </div>
      </div>
      <div style="margin-top:1.25rem;">
        <button class="btn btn--gold" type="submit" id="link-save-btn">Add Link</button>
        <button class="btn btn--outline-dark" type="button" id="link-cancel-btn" hidden>Cancel Edit</button>
      </div>
    </form>

    <div class="admin-card">
      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr><th>Order</th><th>Title</th><th>URL</th><th>Actions</th></tr>
          </thead>
          <tbody id="links-table-body">
            <tr><td colspan="4">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../js/api-config.js"></script>
<script src="../js/hostinger-client.js"></script>
<script src="admin.js"></script>
</body>
</html>
